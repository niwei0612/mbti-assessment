<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 性格测评</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --primary:#4A6CF7;--primary-light:#6B8AFF;--primary-dark:#3451B2;
    --bg:#f0f2f5;--card:#fff;--text:#1a1a2e;--text-sec:#6b7280;
    --border:#e5e7eb;--radius:12px;--shadow:0 2px 8px rgba(0,0,0,.08);
  }
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:center}

  /* ===== App Container ===== */
  .app{width:100%;max-width:700px;min-height:100vh;background:var(--card);margin:0 auto;box-shadow:var(--shadow);position:relative;overflow:hidden}
  @media(min-width:701px){.app{min-height:600px;border-radius:0;max-height:90vh;overflow-y:auto}}

  /* ===== Welcome Page ===== */
  .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center}
  @media(min-width:701px){.welcome{min-height:600px}}
  .welcome-logo{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--primary-light));display:flex;align-items:center;justify-content:center;font-size:36px;color:#fff;margin-bottom:24px;box-shadow:0 4px 16px rgba(74,108,247,.3)}
  .welcome h1{font-size:28px;font-weight:700;margin-bottom:8px}
  .welcome .subtitle{font-size:16px;color:var(--text-sec);margin-bottom:8px}
  .welcome .time-hint{font-size:14px;color:var(--text-sec);margin-bottom:32px;display:inline-flex;align-items:center;gap:6px;background:#f3f4f6;padding:6px 16px;border-radius:20px}
  .welcome .time-hint::before{content:"⏱";font-size:16px}
  .welcome .features{display:flex;gap:12px;margin-bottom:36px;flex-wrap:wrap;justify-content:center}
  .welcome .feature-chip{font-size:13px;color:var(--primary);background:#EEF2FF;padding:6px 14px;border-radius:8px}
  .btn-primary{background:var(--primary);color:#fff;border:none;padding:14px 48px;font-size:17px;border-radius:var(--radius);cursor:pointer;transition:all .2s;font-weight:600;box-shadow:0 4px 12px rgba(74,108,247,.3)}
  .btn-primary:hover{background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 6px 16px rgba(74,108,247,.4)}
  .btn-primary:active{transform:translateY(0)}

  /* ===== Quiz Page ===== */
  .quiz{display:none;flex-direction:column;min-height:100vh;padding:24px}
  @media(min-width:701px){.quiz{min-height:600px}}
  .quiz-header{display:flex;align-items:center;gap:12px;margin-bottom:24px}
  .progress-bar{flex:1;height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:4px;transition:width .3s ease;width:0}
  .progress-text{font-size:14px;color:var(--text-sec);white-space:nowrap;font-weight:600}
  .question-area{flex:1;display:flex;flex-direction:column;justify-content:center}
  .question-num{font-size:14px;color:var(--primary);font-weight:600;margin-bottom:8px}
  .question-text{font-size:20px;line-height:1.6;margin-bottom:28px;font-weight:500}
  .options{display:flex;flex-direction:column;gap:12px}
  .option-btn{display:flex;align-items:center;gap:14px;padding:18px 20px;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .25s;background:#fff;text-align:left;font-size:16px;line-height:1.5;color:var(--text)}
  .option-btn:hover{border-color:var(--primary);background:#F5F7FF}
  .option-btn.selected{border-color:var(--primary);background:#EEF2FF;box-shadow:0 0 0 3px rgba(74,108,247,.12)}
  .option-btn .opt-key{flex-shrink:0;width:36px;height:36px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--text-sec);transition:all .25s}
  .option-btn:hover .opt-key,.option-btn.selected .opt-key{border-color:var(--primary);background:var(--primary);color:#fff}
  .quiz-nav{display:flex;gap:12px;margin-top:20px}
  .btn-back{background:#f3f4f6;color:var(--text-sec);border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;transition:all .2s}
  .btn-back:hover{background:#e5e7eb}
  .btn-back:disabled{opacity:.4;cursor:not-allowed}

  /* ===== Result Page ===== */
  .result{display:none;flex-direction:column;align-items:center;min-height:100vh;padding:40px 24px;text-align:center}
  @media(min-width:701px){.result{min-height:600px}}
  .result-badge{font-size:14px;color:var(--primary);font-weight:600;background:#EEF2FF;padding:6px 18px;border-radius:20px;margin-bottom:20px}
  .result-type{font-size:56px;font-weight:800;letter-spacing:4px;color:var(--primary);margin-bottom:6px;line-height:1.1}
  .result-name{font-size:22px;font-weight:600;margin-bottom:28px}
  .dim-bars{width:100%;max-width:420px;margin-bottom:28px}
  .dim-bar{margin-bottom:16px}
  .dim-label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px}
  .dim-label .dim-active{color:var(--primary)}
  .dim-label .dim-inactive{color:var(--text-sec)}
  .dim-track{height:24px;background:#f3f4f6;border-radius:12px;overflow:hidden;display:flex}
  .dim-fill-left{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));transition:width .6s ease;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:600}
  .dim-fill-right{height:100%;background:#e0e3eb;transition:width .6s ease;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-sec);font-weight:600}
  .result-desc{background:#f9fafb;border-radius:12px;padding:24px;width:100%;max-width:480px;text-align:left;font-size:15px;line-height:1.8;color:var(--text);margin-bottom:28px}
  .result-desc .desc-title{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--text)}
  .result-desc .desc-section{margin-bottom:10px}
  .result-desc .desc-section strong{color:var(--primary)}

  /* ===== Animations ===== */
  .fade-in{animation:fadeIn .4s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .slide-in{animation:slideIn .3s ease}
  @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===== Welcome Page ===== -->
  <div class="welcome" id="page-welcome">
    <div class="welcome-logo">🧠</div>
    <h1>MBTI 性格测评</h1>
    <p class="subtitle">15 题快速了解你的性格类型</p>
    <div class="time-hint">约需 3-5 分钟</div>
    <div class="features">
      <span class="feature-chip">✓ 无需注册</span>
      <span class="feature-chip">✓ 数据不保存</span>
      <span class="feature-chip">✓ 即开即用</span>
    </div>
    <button class="btn-primary" onclick="startQuiz()">开始测评</button>
  </div>

  <!-- ===== Quiz Page ===== -->
  <div class="quiz" id="page-quiz">
    <div class="quiz-header">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">1 / 15</div>
    </div>
    <div class="question-area" id="questionArea">
      <!-- 动态生成 -->
    </div>
    <div class="quiz-nav">
      <button class="btn-back" id="btnBack" onclick="goPrev()" disabled>← 上一题</button>
    </div>
  </div>

  <!-- ===== Result Page ===== -->
  <div class="result" id="page-result">
    <div class="result-badge">测评完成</div>
    <div class="result-type" id="resultType">INTJ</div>
    <div class="result-name" id="resultName">建筑师</div>
    <div class="dim-bars" id="dimBars"></div>
    <div class="result-desc" id="resultDesc"></div>
    <button class="btn-primary" onclick="resetQuiz()">重新测评</button>
  </div>

</div>

// ==================== 题库 ====================

  {dim:'EI',a:'E',b:'I',q:'在团队讨论中，你通常？',aText:'边说边想，通过表达来梳理思路',bText:'先在心里想清楚，再发言表达'},

  {dim:'TF',a:'T',b:'F',q:'评价一个方案好坏时，你认为更重要是？',aText:'客观分析优缺点，就事论事',bText:'考虑团队成员的感受和接受程度'},

  {dim:'JP',a:'J',b:'P',q:'出差前收拾行李，你倾向于？',aText:'列好清单，提前打包，确认不遗漏',bText:'最后一刻快速塞进去，缺了再买'},

// ==================== 16种MBTI类型描述 ====================
var mbtiTypes = {
  INTJ:{name:'建筑师',desc:'你是富有战略眼光的独立思考者。善于看到事物背后的逻辑和规律，喜欢制定长远计划并高效执行。工作中，你追求专业深度，对自己的领域有极高的标准。你的直觉（N）让你看到别人忽略的可能性，而判断（J）让你有强大的执行力把想法落地。',strengths:'善于全局思考、独立解决问题、对复杂系统有强洞察力。',work:'适合需要深度分析和战略规划的工作，在混乱中能迅速找到方向。'},

  ENTP:{name:'辩论家',desc:'你是思维敏捷的创新者。喜欢挑战既有观点，善于从不同角度看问题。工作中，你充满创意，享受头脑风暴和智力碰撞，不喜欢循规蹈矩。你的直觉（N）让你总能想到新点子，感知（P）让你灵活应变。',strengths:'创新能力强、思维灵活、善于发现新机会、适应力强。',work:'适合需要创新和变革的工作，在创业或开拓新业务方向时如鱼得水。'},

// ==================== 页面切换 ====================
function showPage(id){
  document.getElementById('page-welcome').style.display = (id==='welcome')?'flex':'none';
  document.getElementById('page-quiz').style.display = (id==='quiz')?'flex':'none';
  document.getElementById('page-result').style.display = (id==='result')?'flex':'none';
}

// ==================== 开始测评 ====================
function startQuiz(){
  currentQ = 0;
  answers = [];
  showPage('quiz');
  renderQuestion();
}

// ==================== 渲染题目 ====================
function renderQuestion(){
  var q = questions[currentQ];
  var total = questions.length;

  // 进度
  var pct = Math.round((currentQ) / total * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = (currentQ+1) + ' / ' + total;

  // 题目区域
  var area = document.getElementById('questionArea');
  var sel = answers[currentQ] || '';

  area.innerHTML =
    '<div class="question-area fade-in">' +
      '<div class="question-num">第 ' + (currentQ+1) + ' 题</div>' +
      '<div class="question-text">' + q.q + '</div>' +
      '<div class="options">' +
        '<div class="option-btn' + (sel==='a'?' selected':'') + '" onclick="selectAnswer(\'a\')">' +
          '<div class="opt-key">A</div><span>' + q.aText + '</span>' +
        '</div>' +
        '<div class="option-btn' + (sel==='b'?' selected':'') + '" onclick="selectAnswer(\'b\')">' +
          '<div class="opt-key">B</div><span>' + q.bText + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';

  // 上一题按钮
  document.getElementById('btnBack').disabled = (currentQ === 0);
}

// ==================== 选择答案 ====================
function selectAnswer(opt){
  answers[currentQ] = opt;

  // 选中高亮
  var btns = document.querySelectorAll('.option-btn');
  btns.forEach(function(b,i){
    if(i === (opt==='a'?0:1)) b.classList.add('selected');
    else b.classList.remove('selected');
  });

  // 300ms后进入下一题
  setTimeout(function(){
    if(currentQ < questions.length - 1){
      currentQ++;
      renderQuestion();
    } else {
      showResult();
    }
  }, 300);
}

// ==================== 上一题 ====================
function goPrev(){
  if(currentQ > 0){
    currentQ--;
    renderQuestion();
  }
}

// ==================== 计算结果 ====================
function calculateResult(){
  var scores = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  var lastAnswer = {EI:'',SN:'',TF:'',JP:''};

  for(var i=0; i<answers.length; i++){
    var q = questions[i];
    var choice = answers[i];
    var side = (choice === 'a') ? q.a : q.b;
    scores[side]++;
    lastAnswer[q.dim] = side;
  }

  // 判定每个维度，平票取最后一题选择
  var type = '';

  // E/I
  if(scores.E > scores.I) type += 'E';
  else if(scores.I > scores.E) type += 'I';
  else type += lastAnswer.EI;

  // S/N
  if(scores.S > scores.N) type += 'S';
  else if(scores.N > scores.S) type += 'N';
  else type += lastAnswer.SN;

  // T/F
  if(scores.T > scores.F) type += 'T';
  else if(scores.F > scores.T) type += 'F';
  else type += lastAnswer.TF;

  // J/P
  if(scores.J > scores.P) type += 'J';
  else if(scores.P > scores.J) type += 'P';
  else type += lastAnswer.JP;

  // 各维度总数
  var eiTotal = scores.E + scores.I;
  var snTotal = scores.S + scores.N;
  var tfTotal = scores.T + scores.F;
  var jpTotal = scores.J + scores.P;

  return {
    type: type,
    scores: scores,
    dims: {
      EI:{a:'E',b:'I',aVal:scores.E,bVal:scores.I,total:eiTotal},
      SN:{a:'S',b:'N',aVal:scores.S,bVal:scores.N,total:snTotal},
      TF:{a:'T',b:'F',aVal:scores.T,bVal:scores.F,total:tfTotal},
      JP:{a:'J',b:'P',aVal:scores.J,bVal:scores.P,total:jpTotal}
    }
  };
}

// ==================== 显示结果 ====================
function showResult(){
  var result = calculateResult();
  var typeData = mbtiTypes[result.type];

  showPage('result');

  // 类型
  document.getElementById('resultType').textContent = result.type;
  document.getElementById('resultName').textContent = typeData.name;

  // 维度偏好条
  var barsHtml = '';
  var dimNames = {E:'外向',I:'内向',S:'感觉',N:'直觉',T:'思考',F:'情感',J:'判断',P:'感知'};
  ['EI','SN','TF','JP'].forEach(function(d){
    var info = result.dims[d];
    var aPct = Math.round(info.aVal / info.total * 100);
    var bPct = 100 - aPct;
    barsHtml +=
      '<div class="dim-bar">' +
        '<div class="dim-label">' +
          '<span class="dim-active">' + dimNames[info.a] + ' ' + aPct + '%</span>' +
          '<span class="dim-inactive">' + bPct + '% ' + dimNames[info.b] + '</span>' +
        '</div>' +
        '<div class="dim-track">' +
          '<div class="dim-fill-left" style="width:' + aPct + '%">' + aPct + '%</div>' +
          '<div class="dim-fill-right" style="width:' + bPct + '%">' + bPct + '%</div>' +
        '</div>' +
      '</div>';
  });
  document.getElementById('dimBars').innerHTML = barsHtml;

  // 描述
  document.getElementById('resultDesc').innerHTML =
    '<div class="desc-title">性格特征</div>' +
    '<div class="desc-section">' + typeData.desc + '</div>' +
    '<div class="desc-section"><strong>核心优势：</strong>' + typeData.strengths + '</div>' +
    '<div class="desc-section"><strong>工作中的你：</strong>' + typeData.work + '</div>';
}

// ==================== 重新测评 ====================
function resetQuiz(){
  currentQ = 0;
  answers = [];
  showPage('welcome');
}

// ==================== 初始化 ====================
showPage('welcome');
</script>
